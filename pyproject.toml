[project]
name = "factsheet-extractor"
version = "0.1.0"
description = "Extract structured data from UCITS ETF factsheets with a local LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "ollama>=0.5",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factsheet"]
